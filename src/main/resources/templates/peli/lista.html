<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelilista</title>
  <link type="text/css" 
        rel="stylesheet" 
        href="css/bootstrap.min.css" 
        th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="container mt-4">
  <h1>Pelit</h1>

  <div th:if="${param.virhe != null and param.virhe[0] == 'tuloksia'}"
     class="alert alert-warning">
    Peliä ei voi poistaa, koska siihen liittyy tuloksia!
  </div>

  <div class="col-md-4" style="padding:20px 0"
        sec:authorize="isAuthenticated()">
		<form th:action="@{/logout}" method="post">
			<input type="submit" value="Sign Out" class="btn btn-sm btn-danger"/>
		</form>
	</div>

  <div class="col-md-4" style="padding:20px 0" 
        sec:authorize="isAnonymous()">
    <a th:href="@{/login}" class="btn btn-sm btn-primary">
      Login
    </a>
  </div>
  
  <table class="table table-striped">
    <tr>
      <th>Päivämäärä</th>
      <th>Kerho/paikka</th>
    </tr>
    
    <tr th:each="peli : ${pelit}">
      <td th:text="${#temporals.format(peli.pvm, 'dd.MM.yy HH:mm')}"></td>
      <td th:text="${peli.paikka.nimi}"></td>
      <td>
        <a th:href="@{/peli/{id}(id=${peli.peliId})}"
          class="btn btn-info">
            Näytä tulokset
        </a>
      </td>
      <td>
        <a th:href="@{/peli/delete/{id}(id=${peli.peliId})}"
          class="btn btn-danger"
          onclick="return confirm('Are you sure you want to delete?')">
          Poista
        </a>
      </td>
    </tr>
  </table>
  <a href="/peli/add" class="btn btn-outline-primary">Lisää peli</a>
  <a href="/pelaaja/add" class="btn btn-outline-primary">Lisää pelaaja</a>
  <a href="/paikka/add" class="btn btn-outline-primary">Lisää paikka</a>
  <br><br>
  <a href="/tilasto" class="btn btn-outline-dark">Tilastot</a>
  <a href="/pelaaja/lista" class="btn btn-outline-dark">
      Pelaajalistaan
  </a>
  <a href="/paikka/lista" class="btn btn-outline-dark">
      Paikkalistaan
  </a>
  <a href="/tulos/lista" class="btn btn-outline-dark">
      Tuloslistaan
  </a>
</body>
</html>
