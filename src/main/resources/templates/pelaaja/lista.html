<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelaajalista</title>
  <link type="text/css" 
        rel="stylesheet" 
        href="css/bootstrap.min.css" 
        th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="container mt-4">
  <h1>Pelaajat</h1>
  
  <div class="col-md-4" style="padding:20px 0"
        sec:authorize="isAuthenticated()">
		<form th:action="@{/logout}" method="post">
			<input type="submit" value="Sign Out" class="btn btn-sm btn-danger"/>
		</form>
	</div>

  <div class="col-md-4" style="padding:20px 0" 
        sec:authorize="isAnonymous()">
    <a th:href="@{/login}" class="btn btn-sm btn-primary">
      Login
    </a>
  </div>
  
  <table class="table table-striped">
    <tr>
      <th>Kutsumanimi</th>
      <th>Seura</th>
      <th>EMA nro</th>
    </tr>
    
    <tr th:each="pelaaja : ${pelaajat}">
      <td th:text="${pelaaja.kutsumaNimi}"></td>
      <td th:text="${pelaaja.seura}"></td>
      <td th:text="${pelaaja.emaNro}"></td>
      <td>
        <a th:href="@{/pelaaja/delete/{id}(id=${pelaaja.pelaajaId})}"
          class="btn btn-danger"
          onclick="return confirm('Are you sure you want to delete?')">
          Poista
        </a>
      </td>
      <td>
        <a th:href="@{/pelaaja/edit/{id}(id=${pelaaja.pelaajaId})}" class="btn btn-primary">
          Muokkaa
        </a>
      </td>
    </tr>
  </table>
  <a href="/pelaaja/add" class="btn btn-outline-primary">Lisää pelaaja</a>
  <a href="/peli/lista" class="btn btn-outline-dark">
      Pelilistaan
  </a>
  <a href="/paikka/lista" class="btn btn-outline-dark">
      Paikkalistaan
  </a>
  <a href="/tulos/lista" class="btn btn-outline-dark">
      Tuloslistaan
  </a>
</body>
</html>
