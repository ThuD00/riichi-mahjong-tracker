<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paikkalista</title>
</head>
<body>
  <h1>Paikat</h1>

  <table>
    <tr>
      <th>Nimi/Seura</th>
      <th>Kaupunki</th>
    </tr>
    
    <tr th:each="paikka : ${paikat}">
      <td th:text="${paikka.nimi}"></td>
      <td th:text="${paikka.Kaupunki}"></td>
    </tr>
  </table>
</body>
</html>
