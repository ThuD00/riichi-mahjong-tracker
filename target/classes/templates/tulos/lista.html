<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuloslista</title>
  <link type="text/css" 
        rel="stylesheet" 
        href="css/bootstrap.min.css" 
        th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="container mt-4">
  <h1>Tulokset</h1>
  
  <div class="col-md-4" style="padding:20px 0"
        sec:authorize="isAuthenticated()">
		<form th:action="@{/logout}" method="post">
			<input type="submit" value="Sign Out" class="btn btn-sm btn-danger"/>
		</form>
	</div>

  <div class="col-md-4" style="padding:20px 0" 
        sec:authorize="isAnonymous()">
    <a th:href="@{/login}" class="btn btn-sm btn-primary">
      Login
    </a>
  </div>

  <table class="table table-striped">
    <tr>
      <th>Pelaaja</th>
      <th>Pisteet</th>
      <th>Sijoitus</th>
      <th>UMAT</th>
    </tr>
    
    <tr th:each="tulos : ${tulokset}">
      <td th:text="${tulos.pelaaja.kutsumaNimi}"></td>
      <td th:text="${tulos.pisteet}"></td>
      <td th:text="${tulos.sijoitus}"></td>
      <td th:text="${tulos.umat}"></td>
      <td>
        <a th:href="@{/tulos/delete/{id}(id=${tulos.tulosId})}"
          class="btn btn-danger"
          onclick="return confirm('Are you sure you want to delete?')">
          Poista
        </a>
      </td>
      <td>
        <a th:href="@{/tulos/edit/{id}(id=${tulos.tulosId})}" class="btn btn-primary">
          Muokkaa
        </a>
      </td>
    </tr>
  </table>
  <a href="/peli/lista" class="btn btn-outline-dark">
      Pelilistaan
  </a>
  <a href="/pelaaja/lista" class="btn btn-outline-dark">
      Pelaajalistaan
  </a>
  <a href="/paikka/lista" class="btn btn-outline-dark">
      Paikkalistaan
  </a>
</body>
</html>
